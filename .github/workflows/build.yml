name: Build/release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: build
    env:
      FLAND_UPDATE_REPOSITORY: ${{ github.repository }}
      VITE_MULTIPLAYER_DEFAULT_SUPABASE_URL: ${{ vars.VITE_MULTIPLAYER_DEFAULT_SUPABASE_URL }}
      VITE_MULTIPLAYER_DEFAULT_SUPABASE_ANON_KEY: ${{ vars.VITE_MULTIPLAYER_DEFAULT_SUPABASE_ANON_KEY }}
      VITE_MULTIPLAYER_DEVELOPMENT_SUPABASE_URL: ${{ vars.VITE_MULTIPLAYER_DEVELOPMENT_SUPABASE_URL }}
      VITE_MULTIPLAYER_DEVELOPMENT_SUPABASE_ANON_KEY: ${{ vars.VITE_MULTIPLAYER_DEVELOPMENT_SUPABASE_ANON_KEY }}
      VITE_GAME_ENV: ${{ vars.VITE_GAME_ENV }}
      FLAND_BUILD_PROFILE: ${{ vars.FLAND_BUILD_PROFILE }}
      FLAND_BUILD_ANALYZE: ${{ vars.FLAND_BUILD_ANALYZE }}
      FLAND_OBFUSCATE_RENDERER: ${{ vars.FLAND_OBFUSCATE_RENDERER }}
      FLAND_OBFUSCATE_PRELOAD: ${{ vars.FLAND_OBFUSCATE_PRELOAD }}
      FLAND_OBFUSCATE_MAIN: ${{ vars.FLAND_OBFUSCATE_MAIN }}
      FLAND_ENABLE_DEV_FEATURES: ${{ vars.FLAND_ENABLE_DEV_FEATURES }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Electron caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ runner.os }}-electron-v2-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-v2-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          # Keep downloaded CommonJS tools outside this ESM package's scope.
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Refresh yt-dlp to latest release
        run: npm run prepare:ytdlp:latest

      - name: Prepare FFmpeg
        run: npm run prepare:ffmpeg

      - name: Verify and compile translations
        run: |
          npm run i18n:check
          npm run i18n:compile -- --strict

      - name: Build app
        run: npm run build:release

      - name: Package Electron app
        run: npx --no-install electron-builder --publish never
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Extract release notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const text = fs.readFileSync('src/content/changelog.md', 'utf8').replaceAll('\r\n', '\n');
          const marker = '## v' + version + '\n';
          if (!text.includes(marker)) throw new Error('Missing changelog for ' + version);
          const notes = text.split(marker)[1].split(/\n---\n|\n## v/)[0].trim();
          fs.writeFileSync('release-notes.md', notes + '\n');
          NODE

      - name: Publish GitHub release assets
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            release/*.AppImage
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
